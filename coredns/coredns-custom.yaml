apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  custom.server: |
    example.local {
        hosts {
              192.168.1.161 example.local
              fallthrough
        }
    }
    jksvc.local {
        hosts {
              192.168.1.161 jksvc.local
              fallthrough
        }
    }
